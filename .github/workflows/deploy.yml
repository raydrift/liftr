name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  TF_VAR_static_web_app_location: ${{ vars.AZURE_STATIC_WEB_APP_LOCATION }}
  TF_VAR_app_name: ${{ vars.APP_NAME }}
  TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT_NAME }}
  TF_VAR_api_secret_key: ${{ secrets.API_SECRET_KEY }}
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install API dependencies
        working-directory: api
        run: npm install

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Unit test API
        working-directory: api
        run: npm test

      - name: Check frontend JavaScript
        run: node scripts/check-frontend.js

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap Terraform remote state
        uses: azure/cli@v2
        with:
          inlineScript: |
            if ! az storage account show \
              --name "$TF_STATE_STORAGE_ACCOUNT" \
              --resource-group "$TF_STATE_RESOURCE_GROUP" >/dev/null 2>&1; then
              az storage account create \
                --name "$TF_STATE_STORAGE_ACCOUNT" \
                --resource-group "$TF_STATE_RESOURCE_GROUP" \
                --location "${{ vars.AZURE_LOCATION }}" \
                --sku Standard_LRS \
                --kind StorageV2 \
                --allow-blob-public-access false \
                --min-tls-version TLS1_2
            fi

            az storage account blob-service-properties update \
              --account-name "$TF_STATE_STORAGE_ACCOUNT" \
              --resource-group "$TF_STATE_RESOURCE_GROUP" \
              --enable-versioning true

            account_key=$(az storage account keys list \
              --account-name "$TF_STATE_STORAGE_ACCOUNT" \
              --resource-group "$TF_STATE_RESOURCE_GROUP" \
              --query "[0].value" \
              --output tsv)

            az storage container create \
              --name "$TF_STATE_CONTAINER" \
              --account-name "$TF_STATE_STORAGE_ACCOUNT" \
              --account-key "$account_key"

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      - name: Configure managed API origin
        run: |
          static_web_app_url=$(terraform -chdir=terraform output -raw static_web_app_url)
          az staticwebapp appsettings set \
            --name "${{ vars.APP_NAME }}-web" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --setting-names "ALLOWED_ORIGIN=$static_web_app_url"

      - name: Render frontend runtime config
        run: |
          api_base=$(terraform -chdir=terraform output -raw api_base_url)
          cat > frontend/config.js <<EOF
          window.LIFTR_CONFIG = {
            API_BASE: "$api_base",
            API_KEY: "${{ secrets.API_SECRET_KEY }}"
          };
          EOF

      - name: Read Static Web App deployment token
        id: swa-token
        uses: azure/cli@v2
        with:
          inlineScript: |
            token=$(az staticwebapp secrets list \
              --name "${{ vars.APP_NAME }}-web" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "properties.apiKey" \
              --output tsv)
            echo "::add-mask::$token"
            echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: frontend
          api_location: api
          output_location: ""
          skip_app_build: true
